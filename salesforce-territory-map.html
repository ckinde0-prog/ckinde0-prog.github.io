<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Salesforce Territory Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Segoe UI,Arial,sans-serif;background:#f0f4f8;padding:18px;display:flex;justify-content:center}
    .wrap{width:100%;max-width:1200px;background:white;border-radius:10px;padding:22px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    h1{font-size:20px;color:#333;margin-bottom:6px}
    .subtitle{color:#666;margin-bottom:18px}
    .layout{display:flex;gap:18px}
    .map-box{flex:1;min-width:640px;background:#eaf5fb;border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center}
    svg{width:100%;height:auto}
    .legend{width:320px;flex-shrink:0;background:#fff;border-radius:8px;padding:12px;border:1px solid #e6eef4;overflow:auto}
    .legend h3{margin-bottom:10px;color:#333}
    .legend-item{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:8px;border:1px solid #f0f4f7;margin-bottom:10px}
    .legend-color{width:18px;height:18px;border-radius:4px;flex-shrink:0;margin-top:4px}
    .legend-name{font-weight:600;margin:0 0 4px 0}
    .legend-region{font-size:12px;color:#666;margin:0}
    .rep-input{display:flex;gap:8px;margin-top:8px}
    .rep-input input{flex:1;padding:6px;border-radius:6px;border:1px solid #ddd}
    .rep-input button{padding:6px 8px;border-radius:6px;border:0;background:#2f80ed;color:white;cursor:pointer}
    .info-panel{display:none;margin-top:8px;background:linear-gradient(135deg,#2f80ed,#6a5cef);color:white;padding:10px;border-radius:6px}
    .info-panel.active{display:block}
    .state{stroke:#fff;stroke-width:1;cursor:pointer;transition:opacity .15s}
    .state:hover{opacity:0.88}
    .state-label{font-size:10px;fill:#222;font-weight:600;text-anchor:middle;pointer-events:none}
    .controls{display:flex;gap:8px;margin-top:6px}
    .btn{background:#fff;border:1px solid #e6eef4;padding:8px 10px;border-radius:6px;cursor:pointer}
    @media(max-width:900px){.layout{flex-direction:column}.map-box{min-width:unset}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Salesforce Territory Map</h1>
    <div class="subtitle">Territory One, Two, Three — Territory Three shows separate states but one color. Double-click state label to edit.</div>

    <div class="layout">
      <div class="map-box">
        <svg id="map" viewBox="0 0 960 600" aria-label="US map"></svg>
      </div>

      <aside class="legend">
        <h3>Territories</h3>

        <div class="legend-item" data-territory="territory1">
          <div class="legend-color" style="background:#FF6B6B"></div>
          <div style="flex:1">
            <h4 class="legend-name" contenteditable="true" data-territory="territory1">Territory One</h4>
            <p class="legend-region">Colorado, WI</p>
            <div class="rep-input" data-territory-input="territory1">
              <input type="text" placeholder="Salesperson name..." data-rep-input="territory1">
              <button data-rep-save="territory1">Save</button>
            </div>
          </div>
        </div>

        <div class="legend-item" data-territory="territory2">
          <div class="legend-color" style="background:#4ECDC4"></div>
          <div style="flex:1">
            <h4 class="legend-name" contenteditable="true" data-territory="territory2">Territory Two</h4>
            <p class="legend-region">Oshkosh, WI</p>
            <div class="rep-input" data-territory-input="territory2">
              <input type="text" placeholder="Salesperson name..." data-rep-input="territory2">
              <button data-rep-save="territory2">Save</button>
            </div>
          </div>
        </div>

        <div class="legend-item" data-territory="territory3">
          <div class="legend-color" style="background:#FFE66D"></div>
          <div style="flex:1">
            <h4 class="legend-name" contenteditable="true" data-territory="territory3">Territory Three</h4>
            <p class="legend-region">Upper East Coast (individual states)</p>
            <div class="rep-input" data-territory-input="territory3">
              <input type="text" placeholder="Salesperson name..." data-rep-input="territory3">
              <button data-rep-save="territory3">Save</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="exportBtn" class="btn">Export data</button>
          <label class="btn" style="cursor:pointer">
            <input id="importFile" type="file" accept="application/json" style="display:none">
            Import
          </label>
        </div>

        <div id="info" class="info-panel" aria-live="polite">
          <div id="infoTitle" style="font-weight:700"></div>
          <div id="infoDesc" style="font-size:13px;margin-top:6px"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
  // Territories config
  const territories = {
    territory1: { name: 'Territory One', color: '#FF6B6B', states: ['CO','WI'], description:'Colorado and Wisconsin' },
    territory2: { name: 'Territory Two', color: '#4ECDC4', states: ['WI'], description:'Oshkosh, WI' },
    territory3: { name: 'Territory Three', color: '#FFE66D', states: ['ME','NH','VT','MA','RI','CT','NY','NJ','PA'], description:'Upper East Coast' }
  };

  // FIPS -> USPS
  const idToState = {1:'AL',2:'AK',4:'AZ',5:'AR',6:'CA',8:'CO',9:'CT',10:'DE',11:'DC',12:'FL',13:'GA',15:'HI',16:'ID',17:'IL',18:'IN',19:'IA',20:'KS',21:'KY',22:'LA',23:'ME',24:'MD',25:'MA',26:'MI',27:'MN',28:'MS',29:'MO',30:'MT',31:'NE',32:'NV',33:'NH',34:'NJ',35:'NM',36:'NY',37:'NC',38:'ND',39:'OH',40:'OK',41:'OR',42:'PA',44:'RI',45:'SC',46:'SD',47:'TN',48:'TX',49:'UT',50:'VT',51:'VA',53:'WA',54:'WV',55:'WI',56:'WY'};

  // LocalStorage keys
  const REPS_KEY = 'sf_map_reps_v1';
  const LEGEND_KEY = 'sf_map_legend_v1';
  const LABELS_KEY = 'sf_map_labels_v1'; // optional per-state labels

  function loadReps(){ try{ return JSON.parse(localStorage.getItem(REPS_KEY) || '{}'); }catch(e){return{}} }
  function saveReps(obj){ localStorage.setItem(REPS_KEY, JSON.stringify(obj)); }
  function loadLegend(){ try{ return JSON.parse(localStorage.getItem(LEGEND_KEY) || '{}'); }catch(e){return{}} }
  function saveLegend(obj){ localStorage.setItem(LEGEND_KEY, JSON.stringify(obj)); }

  // Build state->territory map (allow multiple but we use first)
  const stateToTerritory = {};
  Object.entries(territories).forEach(([tid, t]) => t.states.forEach(s => {
    if(!stateToTerritory[s]) stateToTerritory[s] = [];
    stateToTerritory[s].push(tid);
  }));

  // Initialize
  async function init() {
    const svg = d3.select('#map');
    const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
    const statesGeo = topojson.feature(us, us.objects.states);
    const path = d3.geoPath();
    // Fit viewBox nicely
    const projection = d3.geoAlbersUsa().fitSize([960,600], statesGeo);
    path.projection(projection);

    // background
    svg.append('rect').attr('width',960).attr('height',600).attr('fill','#eaf5fb');

    const states = statesGeo.features;
    svg.selectAll('.state').data(states).enter()
      .append('path')
      .attr('class','state')
      .attr('d', path)
      .attr('data-fips', d => d.id)
      .attr('data-state', d => idToState[d.id] || '')
      .attr('fill', d => {
        const abbr = idToState[d.id];
        if(abbr && stateToTerritory[abbr]) {
          const tid = stateToTerritory[abbr][0];
          return territories[tid].color;
        }
        return '#ddd';
      })
      .on('click', (event,d) => {
        const name = (d.properties && d.properties.name) || d.id;
        const abbr = idToState[d.id];
        if(abbr && stateToTerritory[abbr]) {
          showTerritory(stateToTerritory[abbr][0]);
        } else {
          showUnassigned(name);
        }
      })
      .on('mouseover', function(){ d3.select(this).style('opacity',0.9)})
      .on('mouseout', function(){ d3.select(this).style('opacity',1)});

    // borders
    svg.append('path')
      .attr('fill','none')
      .attr('stroke','#fff')
      .attr('stroke-width',1)
      .attr('d', path(topojson.mesh(us, us.objects.states, (a,b)=>(a!==b))));

    // labels (will show rep if present, otherwise territory name)
    renderLabels(svg, states, path);

    // wire legend inputs & persistence
    wireLegend();
    wireExportImport();
  }

  function renderLabels(svg, states, path) {
    const reps = loadReps();
    const labels = (function(){ try{return JSON.parse(localStorage.getItem(LABELS_KEY)||'{}')}catch(e){return{}} })();

    svg.selectAll('.state-label').remove();
    svg.selectAll('.state-label')
      .data(states)
      .enter()
      .append('text')
      .attr('class','state-label')
      .attr('data-state', d => idToState[d.id] || '')
      .attr('x', d => { const c = path.centroid(d); return isFinite(c[0]) ? c[0] : 0 })
      .attr('y', d => { const c = path.centroid(d); return isFinite(c[1]) ? c[1]+4 : 0 })
      .text(d => {
        const abbr = idToState[d.id];
        if(!abbr) return '';
        if(labels[abbr]) return labels[abbr];
        if(stateToTerritory[abbr]) {
          const tid = stateToTerritory[abbr][0];
          if(reps[tid]) return reps[tid];
          return territories[tid].name;
        }
        return abbr;
      })
      .style('font-size','10px')
      .on('dblclick', function(event,d){
        event.stopPropagation();
        const abbr = idToState[d.id];
        if(!abbr) return;
        openStateEditor(this, abbr);
      });
  }

  function openStateEditor(el, stateAbbr) {
    const labels = (function(){ try{return JSON.parse(localStorage.getItem(LABELS_KEY)||'{}')}catch(e){return{}} })();
    const val = labels[stateAbbr] || el.textContent || stateAbbr;
    const input = document.createElement('input');
    input.value = val;
    Object.assign(input.style, {position:'absolute',zIndex:9999,minWidth:'140px',padding:'6px',borderRadius:'6px',border:'1px solid #ccc'});
    document.body.appendChild(input);
    const rect = el.getBoundingClientRect();
    input.style.left = (rect.left + window.scrollX - 30) + 'px';
    input.style.top = (rect.top + window.scrollY - 10) + 'px';
    input.focus(); input.select();
    function commit(){
      const v = input.value.trim();
      try {
        const L = JSON.parse(localStorage.getItem(LABELS_KEY)||'{}');
        if(v) L[stateAbbr] = v; else delete L[stateAbbr];
        localStorage.setItem(LABELS_KEY, JSON.stringify(L));
      } catch(e){}
      input.remove();
      // re-render labels quickly by refreshing map
      location.reload();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') input.remove();});
  }

  function wireLegend(){
    // populate existing reps
    const reps = loadReps();
    document.querySelectorAll('[data-rep-input]').forEach(el => {
      const tid = el.getAttribute('data-territory-input');
      const inp = el.querySelector(`[data-rep-input="${tid}"]`);
      const btn = el.querySelector(`[data-rep-save="${tid}"]`);
      if(inp) inp.value = reps[tid] || '';
      btn.addEventListener('click', ()=>{
        const val = inp.value.trim();
        const newReps = loadReps();
        if(val) newReps[tid] = val; else delete newReps[tid];
        saveReps(newReps);
        // update labels on map
        location.reload();
      });
    });

    // legend name persistence
    const legendStore = loadLegend();
    document.querySelectorAll('.legend-name').forEach(el => {
      const tid = el.dataset.territory;
      if(legendStore[tid]) el.textContent = legendStore[tid];
      el.addEventListener('input', ()=>{
        legendStore[tid] = el.textContent.trim();
        saveLegend(legendStore);
        // update territories object for immediate reflection
        if(territories[tid]) territories[tid].name = el.textContent.trim();
        // update labels on map
        document.querySelectorAll('.state-label').forEach(t => {
          const s = t.getAttribute('data-state');
          const mapping = stateToTerritory[s];
          if(mapping) {
            const tid2 = mapping[0];
            const repsLocal = loadReps();
            t.textContent = (repsLocal[tid2] || territories[tid2].name);
          }
        });
      });
    });

    // legend click to show territory info
    document.querySelectorAll('.legend-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const tid = item.dataset.territory;
        showTerritory(tid);
      });
    });
  }

  function showTerritory(tid){
    const info = document.getElementById('info');
    const t = territories[tid];
    const reps = loadReps();
    document.getElementById('infoTitle').textContent = t.name;
    document.getElementById('infoDesc').textContent = `${t.description} — States: ${t.states.join(', ')}`;
    info.classList.add('active');
    // highlight states visually
    d3.selectAll('.state').classed('active', function(d){
      const abbr = idToState[d.id];
      return abbr && stateToTerritory[abbr] && stateToTerritory[abbr].includes(tid);
    });
  }
  function showUnassigned(name){
    const info = document.getElementById('info');
    document.getElementById('infoTitle').textContent = 'Unassigned: ' + name;
    document.getElementById('infoDesc').textContent = 'This state is not assigned to a territory.';
    info.classList.add('active');
  }

  function wireExportImport(){
    document.getElementById('exportBtn').addEventListener('click', ()=>{
      const obj = { reps: loadReps(), legend: loadLegend(), labels:(function(){try{return JSON.parse(localStorage.getItem(LABELS_KEY)||'{}')}catch(e){return{}}})() };
      const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'sf-map-export.json'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('importFile').addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = function(evt){
        try{
          const obj = JSON.parse(evt.target.result);
          if(obj.reps) localStorage.setItem(REPS_KEY, JSON.stringify(obj.reps));
          if(obj.legend) localStorage.setItem(LEGEND_KEY, JSON.stringify(obj.legend));
          if(obj.labels) localStorage.setItem(LABELS_KEY, JSON.stringify(obj.labels));
          location.reload();
        }catch(err){ alert('Invalid JSON'); }
      };
      r.readAsText(f);
    });
  }

  // Start
  init().catch(err=>{
    console.error('init failed', err);
    alert('Map failed to load. If you opened via file://, run a local server (see instructions).');
  });
  </script>
</body>
</html>
