<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Territory Map - United States</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .map-section {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .map-container {
            flex: 1;
            min-width: 700px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .legend {
            flex: 0 0 280px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            max-height: 600px;
            overflow-y: auto;
        }

        .legend h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .legend-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .legend-item.active {
            background: #e8f4f8;
            border-left-color: #667eea;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .legend-text h4 {
            color: #333;
            font-size: 1em;
            margin-bottom: 3px;
        }

        .legend-text p {
            color: #666;
            font-size: 0.85em;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .state {
            cursor: pointer;
            transition: opacity 0.3s ease, filter 0.3s ease;
            stroke: white;
            stroke-width: 1.5;
        }

        .state:hover {
            opacity: 0.85;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.2));
        }

        .state.active {
            opacity: 1;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.3));
        }

        .state-label {
            font-size: 10px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
            fill: #333;
        }

        .unassigned {
            fill: #ddd !important;
            opacity: 0.6;
        }

        .info-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .info-panel.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-panel h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .info-panel p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 5px;
        }

        .states-list {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 0.95em;
            line-height: 1.8;
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .reset-btn:hover {
            background: #f5f5f5;
            transform: scale(1.05);
        }

        @media (max-width: 1024px) {
            .map-section {
                flex-direction: column;
            }

            .map-container {
                min-width: auto;
            }

            .legend {
                flex: none;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Salesforce Territory Map</h1>
        <p class="subtitle">United States Sales Territories</p>

        <div class="map-section">
            <div class="map-container">
                <svg id="map" width="900" height="550"></svg>
            </div>

            <div class="legend">
                <h3>Territories</h3>
                <div class="legend-item" data-territory="territory1">
                    <div class="legend-color" style="background: #FF6B6B;"></div>
                    <div class="legend-text">
                        <h4>Territory One</h4>
                        <p>Colorado, WI</p>
                    </div>
                </div>
                <div class="legend-item" data-territory="territory2">
                    <div class="legend-color" style="background: #4ECDC4;"></div>
                    <div class="legend-text">
                        <h4>Territory Two</h4>
                        <p>Oshkosh, WI</p>
                    </div>
                </div>
                <div class="legend-item" data-territory="territory3">
                    <div class="legend-color" style="background: #FFE66D;"></div>
                    <div class="legend-text">
                        <h4>Territory Three</h4>
                        <p>Upper East Coast</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">
            <h2 id="infoTitle"></h2>
            <p id="infoDescription"></p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Region</div>
                    <div class="stat-value" id="infoRegion"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Territory ID</div>
                    <div class="stat-value" id="infoId"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">States Covered</div>
                    <div class="stat-value" id="infoCovered"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Status</div>
                    <div class="stat-value">Active</div>
                </div>
            </div>
            <div class="states-list" id="statesList"></div>
            <button class="reset-btn" onclick="resetSelection()">Close</button>
        </div>
    </div>

    <script>
        // Territory Data - Complete US Coverage
        const territories = {
            territory1: {
                name: 'Territory One',
                description: 'Colorado and Wisconsin sales territory',
                region: 'Colorado, WI',
                states: ['CO', 'WI'],
                color: '#FF6B6B'
            },
            territory2: {
                name: 'Territory Two',
                description: 'Oshkosh, Wisconsin sales territory - Specialty focus area',
                region: 'Oshkosh, WI',
                states: ['WI'], // Overlaps with Territory One
                color: '#4ECDC4',
                isSubTerritory: true
            },
            territory3: {
                name: 'Territory Three',
                description: 'Upper East Coast sales territory',
                region: 'Upper East Coast',
                states: ['ME', 'NH', 'VT', 'MA', 'RI', 'CT', 'NY', 'NJ', 'PA'],
                color: '#FFE66D'
            }
        };

        // State abbreviations for all 50 states
        const allStates = [
            'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
            'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
            'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
            'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
            'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ];

        // Create a map of state to territory
        const stateToTerritory = {};
        Object.entries(territories).forEach(([id, territory]) => {
            territory.states.forEach(state => {
                if (!stateToTerritory[state]) {
                    stateToTerritory[state] = [];
                }
                stateToTerritory[state].push(id);
            });
        });

        // Initialize Map with D3
        async function initializeMap() {
            const svg = d3.select('#map');
            
            // Load US TopoJSON
            const us = await d3.json('https://d3js.org/us-110m.v1.json');
            
            // Create projection
            const projection = d3.geoAlbersUsa()
                .fitSize([880, 530], topojson.feature(us, us.objects.states));
            
            const path = d3.geoPath().projection(projection);
            
            // Add background
            svg.append('rect')
                .attr('width', 900)
                .attr('height', 550)
                .attr('fill', '#E8F4F8');
            
            // Add states
            const states = topojson.feature(us, us.objects.states).features;
            
            svg.selectAll('.state')
                .data(states)
                .enter()
                .append('path')
                .attr('class', 'state')
                .attr('d', path)
                .attr('fill', d => {
                    const stateName = getStateAbbreviation(d.properties.name);
                    if (stateToTerritory[stateName]) {
                        const territoryId = stateToTerritory[stateName][0]; // Primary territory
                        return territories[territoryId].color;
                    }
                    return '#ddd';
                })
                .attr('data-state', d => getStateAbbreviation(d.properties.name))
                .attr('data-name', d => d.properties.name)
                .on('click', function() {
                    const state = d3.select(this).attr('data-state');
                    if (stateToTerritory[state]) {
                        selectTerritory(stateToTerritory[state][0]);
                    }
                })
                .on('mouseover', function() {
                    const state = d3.select(this).attr('data-state');
                    if (!stateToTerritory[state]) {
                        d3.select(this).style('opacity', '0.7');
                    }
                })
                .on('mouseout', function() {
                    const state = d3.select(this).attr('data-state');
                    if (!stateToTerritory[state]) {
                        d3.select(this).style('opacity', '0.6');
                    }
                });
            
            // Add state borders/mesh
            svg.append('path')
                .attr('fill', 'none')
                .attr('stroke', 'white')
                .attr('stroke-width', 1.5)
                .attr('d', path(topojson.mesh(us, us.objects.states, (a, b) => a !== b)));
        }

        // Convert state name to abbreviation
        function getStateAbbreviation(name) {
            const stateMap = {
                'Alabama': 'AL', 'Alaska': 'AK', 'Arizona': 'AZ', 'Arkansas': 'AR',
                'California': 'CA', 'Colorado': 'CO', 'Connecticut': 'CT', 'Delaware': 'DE',
                'Florida': 'FL', 'Georgia': 'GA', 'Hawaii': 'HI', 'Idaho': 'ID',
                'Illinois': 'IL', 'Indiana': 'IN', 'Iowa': 'IA', 'Kansas': 'KS',
                'Kentucky': 'KY', 'Louisiana': 'LA', 'Maine': 'ME', 'Maryland': 'MD',
                'Massachusetts': 'MA', 'Michigan': 'MI', 'Minnesota': 'MN', 'Mississippi': 'MS',
                'Missouri': 'MO', 'Montana': 'MT', 'Nebraska': 'NE', 'Nevada': 'NV',
                'New Hampshire': 'NH', 'New Jersey': 'NJ', 'New Mexico': 'NM', 'New York': 'NY',
                'North Carolina': 'NC', 'North Dakota': 'ND', 'Ohio': 'OH', 'Oklahoma': 'OK',
                'Oregon': 'OR', 'Pennsylvania': 'PA', 'Rhode Island': 'RI', 'South Carolina': 'SC',
                'South Dakota': 'SD', 'Tennessee': 'TN', 'Texas': 'TX', 'Utah': 'UT',
                'Vermont': 'VT', 'Virginia': 'VA', 'Washington': 'WA', 'West Virginia': 'WV',
                'Wisconsin': 'WI', 'Wyoming': 'WY'
            };
            return stateMap[name] || name;
        }

        // Select Territory
        function selectTerritory(territoryId) {
            // Highlight states in territory
            d3.selectAll('.state')
                .classed('active', d => {
                    const state = d3.select(this).attr('data-state');
                    return stateToTerritory[state] && stateToTerritory[state].includes(territoryId);
                });

            // Update legend
            document.querySelectorAll('.legend-item').forEach(item => {
                item.classList.toggle('active', item.dataset.territory === territoryId);
            });

            // Show info panel
            const territory = territories[territoryId];
            document.getElementById('infoTitle').textContent = territory.name;
            document.getElementById('infoDescription').textContent = territory.description;
            document.getElementById('infoRegion').textContent = territory.region;
            document.getElementById('infoId').textContent = territoryId.toUpperCase();
            document.getElementById('infoCovered').textContent = territory.states.length;
            document.getElementById('statesList').textContent = 'States: ' + territory.states.join(', ');
            document.getElementById('infoPanel').classList.add('active');
        }

        // Reset Selection
        function resetSelection() {
            d3.selectAll('.state').classed('active', false);
            document.querySelectorAll('.legend-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById('infoPanel').classList.remove('active');
        }

        // Add legend click handlers
        document.querySelectorAll('.legend-item').forEach(item => {
            item.addEventListener('click', () => {
                selectTerritory(item.dataset.territory);
            });
        });

        // Load TopoJSON library
        const script = document.createElement('script');
        script.src = 'https://d3js.org/topojson.v3.min.js';
        script.onload = initializeMap;
        document.head.appendChild(script);
    </script>
</body>
</html>
