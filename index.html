Const openButtons = document.querySelectorAll(‘.trigger-quote-modal’);
Const closeBtn = document.getElementById(‘closeQuoteModal’);
Const quoteForm = document.getElementById(‘bulkQuoteForm’);
Const phoneInput = document.getElementById(‘clientPhone’);
// Toggle Dialog States
openButtons.forEach(button => {
button.addEventListener(‘click’, € => {
e.preventDefault();
modal.showModal();
});
});
closeBtn.addEventListener(‘click’, () => modal.close());
// Auto-Formatting 10-Digit Regular Expression Input Mask
phoneInput.addEventListener(‘input’, € => {
let input = e.target.value.replace(/\D/g, ‘’);
let size = input.length;
if (size === 0) { e.target.value = ‘’; }
else if (size < 4) { e.target.value = (${input}; }
else if (size < 7) { e.target.value = (${input.substring(0, 3)}) ${input.substring(3)}; }
else { e.target.value = (${input.substring(0, 3)}) ${input.substring(3, 6)}-${input.substring(6, 10)}; }
});
// Form Interception & Power Automate Data Transmission
quoteForm.addEventListener(‘submit’, async € => {
e.preventDefault();
const quantityInput = document.getElementById(‘orderQty’);
const quantityValue = parseInt(quantityInput.value, 10);
// Hard safety validation constraint check

};
